services:
  mysql:
    environment:
      MYSQL_DATABASE: inventory_db_test

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_db_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_FLYWAY_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  test:
    container_name: frontend-test
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: test
      VITE_BACKEND_URL: http://backend:8888/api/v1
    command: sh -c "npm ci 2>/dev/null && npm run test:api"
    networks:
      - network

  e2e:
    container_name: frontend-e2e
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      nginx:
        condition: service_started
    environment:
      BASE_URL: http://nginx:80
      API_URL: http://backend:8888/api/v1
    command: sh -c "npm ci 2>/dev/null && npx playwright test --reporter=list"
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_API_URL: /api/v1
        VITE_SKIP_AUTH: "false"

  nginx:
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
