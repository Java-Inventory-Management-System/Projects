# 4 sequential jobs: test → integration → build-and-push → deploy
# Each depends on the previous one via "needs:".

name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*']
  # Manual trigger via GitHub UI — used for rollback
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (leave empty for latest built tag)'
        required: false
        default: ''

# Cancel outdated runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:

  # --------------------------------------------------------------------------
  # JOB 1: UNIT TESTS — JDK 25 + Node 22, no Docker
  # --------------------------------------------------------------------------
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Backend build & unit tests
        working-directory: ./backend
        run: ./mvnw -B -ntp verify
        env:
          JWT_SECRET: test-secret-key-256-bits-long-for-hs256-algorithm
          JWT_EXPIRATION: 3600000
          MAIL_ENABLED: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run --if-present lint

      - name: Frontend unit tests
        working-directory: ./frontend
        run: npm test

  # --------------------------------------------------------------------------
  # JOB 2: INTEGRATION + E2E TESTS — Docker Compose full stack
  # --------------------------------------------------------------------------
  integration:
    needs: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # .env is gitignored, CI must create it for Docker Compose
      - name: Create .env for Docker Compose
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=dev-secret-key-change-in-prod
          JWT_EXPIRATION=86400000
          JWT_REFRESH_EXPIRATION=86400000
          JWT_COOKIE_NAME=dawn-jwt
          JWT_COOKIE_REFRESH_NAME=dawn-jwt-refresh
          FRONTEND_URL=http://localhost
          DB_USER=root
          DB_PASS=123456
          DB_DRIVER=com.mysql.cj.jdbc.Driver
          MAIL_ENABLED=false
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USERNAME=dummy
          MAIL_PASSWORD=dummy
          MAIL_FROM=noreply@test.local
          VITE_BASE_API_URL=/api/v1
          MYSQL_DATABASE=inventory_db
          EOF

      # "make test" = build images → start MySQL + BE → integration tests → start FE + nginx → E2E tests → cleanup
      - name: Run integration & E2E tests
        run: make test

  # --------------------------------------------------------------------------
  # JOB 3: BUILD & PUSH — Docker images to GHCR
  #   Runs only on push to develop (not PR, not manual dispatch).
  #   Tags: sha-<commit>, latest, and v* (on git tag).
  #   Note: workflow_dispatch intentionally excluded — when dependencies
  #   (test/integration) are skipped, success() returns false, so the
  #   condition would never be met anyway. Dispatch = deploy only (rollback).
  # --------------------------------------------------------------------------
  build-and-push:
    needs: [test, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute namespace & deploy tag
        id: meta
        run: |
          NAMESPACE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          SHA_TAG=sha-${GITHUB_SHA::7}
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/backend
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/frontend
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            VITE_BASE_API_URL=${{ vars.VITE_BASE_API_URL != '' && vars.VITE_BASE_API_URL || '/api/v1' }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --------------------------------------------------------------------------
  # JOB 4: DEPLOY — SSH into VPS, pull GHCR images, restart
  #   Also supports manual rollback: workflow_dispatch with image_tag input
  #   Requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
  #
  #   Uses its own concurrency group (separate from the workflow-level one)
  #   so that a new push never cancels a deploy mid-flight (e.g. while SSH'd
  #   into the VPS running docker compose up -d).
  # --------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    # always() lets deploy run even if build was skipped (manual rollback)
    if: |
      always() &&
      (needs.build-and-push.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Resolve deploy tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy of tag: ${{ github.event.inputs.image_tag }}"
          else
            echo "tag=${{ needs.build-and-push.outputs.deploy_tag }}" >> "$GITHUB_OUTPUT"
            echo "Deploying freshly built tag: ${{ needs.build-and-push.outputs.deploy_tag }}"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            export IMAGE_TAG=${{ steps.tag.outputs.tag }}
            echo "Pulling images (tag: $IMAGE_TAG)..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "Pruning old images..."
            docker image prune -f
            echo "Deploy complete (tag: $IMAGE_TAG)"
