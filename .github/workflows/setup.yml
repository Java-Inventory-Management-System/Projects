# Jobs: changes → test-backend / test-frontend → integration → build-and-push → deploy
# `build-and-push` uses matrix for both services (one block, no copy-paste).
# Build-and-push always builds both images even if one didn't change — deploy
# pulls by sha tag, an untouched image would have no sha tag in the registry.

name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (manual rollback)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  # detects which service changed — skips test jobs for untouched services
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # backend unit tests (skipped if backend didn't change)
  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Backend build & unit tests
        working-directory: ./backend
        run: ./mvnw -B -ntp verify
        env:
          JWT_SECRET: test-secret-key-256-bits-long-for-hs256-algorithm
          JWT_EXPIRATION: 3600000
          MAIL_ENABLED: false

  # frontend unit tests (skipped if frontend didn't change)
  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run --if-present lint

      - name: Frontend unit tests
        working-directory: ./frontend
        run: npm test

  # integration + E2E (skipped if only docs changed). Uses !failure()
  # instead of success() — GH Community #45058.
  integration:
    needs: [changes, test-backend, test-frontend]
    if: |
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # .env is gitignored, CI must create it. Throwaway values, never reused in prod.
      - name: Create .env for Docker Compose
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=dev-secret-key-change-in-prod
          JWT_EXPIRATION=86400000
          JWT_REFRESH_EXPIRATION=86400000
          JWT_COOKIE_NAME=dawn-jwt
          JWT_COOKIE_REFRESH_NAME=dawn-jwt-refresh
          FRONTEND_URL=http://localhost
          DB_USER=root
          DB_PASS=123456
          DB_DRIVER=com.mysql.cj.jdbc.Driver
          MAIL_ENABLED=false
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USERNAME=dummy
          MAIL_PASSWORD=dummy
          MAIL_FROM=noreply@test.local
          VITE_BASE_API_URL=/api/v1
          MYSQL_DATABASE=inventory_db
          EOF

      - name: Run integration & E2E tests
        run: make test

  # build & push Docker images to GHCR (matrix: one block for both services)
  build-and-push:
    needs: [test-backend, test-frontend, integration]
    if: github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ''
          - service: frontend
            context: ./frontend
            build_args: |
              VITE_BASE_API_URL=${{ vars.VITE_BASE_API_URL != '' && vars.VITE_BASE_API_URL || '/api/v1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute namespace & deploy tag
        id: meta
        run: |
          NAMESPACE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          SHA_TAG=sha-${GITHUB_SHA::7}
          echo "deploy_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (${{ matrix.service }})
        id: meta-service
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-service.outputs.tags }}
          labels: ${{ steps.meta-service.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # SSH deploy to VPS (supports manual rollback via workflow_dispatch)
  deploy:
    needs: build-and-push
    if: |
      always() &&
      (needs.build-and-push.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Resolve deploy tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy of tag: ${{ github.event.inputs.image_tag }}"
          else
            echo "tag=${{ needs.build-and-push.outputs.deploy_tag }}" >> "$GITHUB_OUTPUT"
            echo "Deploying freshly built tag: ${{ needs.build-and-push.outputs.deploy_tag }}"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            export IMAGE_TAG=${{ steps.tag.outputs.tag }}
            echo "Pulling images (tag: $IMAGE_TAG)..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "Pruning old images..."
            docker image prune -f
            echo "Deploy complete (tag: $IMAGE_TAG)"
