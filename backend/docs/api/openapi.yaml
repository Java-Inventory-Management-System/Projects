openapi: "3.0.3"
info:
  title: Backend API
  description: API documentation for the backend service
  version: "1.0.0"
servers:
  - url: http://localhost:8888
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    # =========================== COMMON ===========================
    ResponseObject:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          nullable: true

    ResponsePage:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    ExceptionMessage:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "14-07-2026 10:30:00"
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed

    URole:
      type: string
      enum: [ADMIN, MANAGER, SALES, STOCK]

    # =========================== AUTH ===========================
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          format: password
          example: "******"

    JwtResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        userId:
          type: integer
        username:
          type: string
        isPasswordReset:
          type: boolean

    TokenRefreshResponse:
      type: object
      properties:
        accessToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordTokenRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword, confirmPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    # =========================== USER ===========================
    RegisterRequest:
      type: object
      required: [fullName, email, roleName, status]
      properties:
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
        roleName:
          $ref: "#/components/schemas/URole"
        status:
          type: string
          example: ACTIVE

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/URole"
        status:
          type: string
        gender:
          type: integer
          nullable: true
        dob:
          type: string
          format: date-time
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        isPasswordReset:
          type: boolean
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserResponse:
      allOf:
        - $ref: "#/components/schemas/UserResponse"
        - type: object
          properties:
            tempPassword:
              type: string

    UpdateInfoRequest:
      type: object
      properties:
        fullName:
          type: string
        gender:
          type: integer
          nullable: true
        dob:
          type: string
          format: date-time
          nullable: true
        phoneNumber:
          type: string
          nullable: true

    ToggleActiveRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    # =========================== BRAND ===========================
    BrandRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    BrandResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== CATEGORY ===========================
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== PRODUCT ===========================
    ProductRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        brandId:
          type: integer
        categoryId:
          type: integer
        description:
          type: string
        unit:
          type: string
        trackingType:
          type: string
        sellPrice:
          type: number
          format: decimal
        minStock:
          type: integer

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        brandId:
          type: integer
          nullable: true
        brandName:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        trackingType:
          type: string
          nullable: true
        sellPrice:
          type: number
          format: decimal
          nullable: true
        minStock:
          type: integer
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== SUPPLIER ===========================
    SupplierRequest:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        taxCode:
          type: string
        note:
          type: string

    SupplierResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contactPerson:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        taxCode:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== PRODUCT IMAGE ===========================
    ProductImageRequest:
      type: object
      required: [productId, url]
      properties:
        productId:
          type: integer
        url:
          type: string
          format: uri
        isPrimary:
          type: boolean
        sortOrder:
          type: integer

    ProductImageResponse:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        url:
          type: string
        isPrimary:
          type: boolean
        sortOrder:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    # =========================== AUDIT LOG ===========================
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        action:
          type: string
        entityName:
          type: string
        entityId:
          type: string
          nullable: true
        oldValue:
          type: string
          nullable: true
          description: JSON string
        newValue:
          type: string
          nullable: true
          description: JSON string
        status:
          type: string
        errorMsg:
          type: string
          nullable: true
      createdAt:
        type: string
        format: date-time

    # =========================== IMPORT RECEIPT ===========================
    ImportReceiptRequest:
      type: object
      required: [supplierId, items]
      properties:
        receiptCode:
          type: string
        supplierId:
          type: integer
        note:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportItemRequest"

    ImportItemRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal
        warrantyMonths:
          type: integer
        serialNumbers:
          type: array
          items:
            type: string
        locationId:
          type: integer

    ImportReceiptResponse:
      type: object
      properties:
        id:
          type: integer
        receiptCode:
          type: string
        supplierId:
          type: integer
        supplierName:
          type: string
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, PENDING_APPROVAL, COMPLETED, CANCELLED]
        note:
          type: string
          nullable: true
        createdBy:
          type: integer
        createdByName:
          type: string
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportItemResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ImportItemResponse:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal
        warrantyMonths:
          type: integer
        createdUnits:
          type: integer

    # =========================== EXPORT RECEIPT ===========================
    ExportReceiptRequest:
      type: object
      required: [reason, items]
      properties:
        reason:
          type: string
          enum: [SALE, INTERNAL, RETURN_SUPPLIER, DISPOSE]
        customerId:
          type: integer
        note:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportItemRequest"

    ExportItemRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal

    ExportReceiptResponse:
      type: object
      properties:
        id:
          type: integer
        receiptCode:
          type: string
        reason:
          type: string
        customerId:
          type: integer
          nullable: true
        customerName:
          type: string
          nullable: true
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING_APPROVAL, COMPLETED, CANCELLED]
        note:
          type: string
          nullable: true
        createdBy:
          type: integer
        createdByName:
          type: string
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportItemResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExportItemResponse:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal

    # =========================== PRODUCT UNIT ===========================
    ProductUnitResponse:
      type: object
      properties:
        id:
          type: integer
        serialNumber:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        trackingType:
          type: string
          enum: [SERIALIZED, BULK]
        initialQuantity:
          type: number
          format: decimal
        remainingQuantity:
          type: number
          format: decimal
        importReceiptItemId:
          type: integer
        locationId:
          type: integer
          nullable: true
        locationCode:
          type: string
          nullable: true
        status:
          type: string
        importedAt:
          type: string
          format: date-time
        warrantyMonths:
          type: integer
        warrantyStartDate:
          type: string
          format: date-time
          nullable: true
        warrantyExpiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== STOCK CHECK ===========================
    CreateStockCheckRequest:
      type: object
      required: [productUnitIds]
      properties:
        note:
          type: string
        productUnitIds:
          type: array
          items:
            type: integer

    StockCheckItemRequest:
      type: object
      properties:
        productUnitId:
          type: integer
        actualStatus:
          type: string
        countedQuantity:
          type: number
          format: decimal
        note:
          type: string

    StockCheckItemBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCheckItemRequest"

    ApproveStockCheckRequest:
      type: object
      properties:
        approvalNote:
          type: string

    StockCheckResponse:
      type: object
      properties:
        id:
          type: integer
        checkCode:
          type: string
        status:
          type: string
        note:
          type: string
          nullable: true
        createdBy:
          type: integer
        createdByName:
          type: string
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        approvalNote:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCheckItemResponse"
        totalItems:
          type: integer
        matchCount:
          type: integer
        missingCount:
          type: integer
        unexpectedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockCheckItemResponse:
      type: object
      properties:
        id:
          type: integer
        productUnitId:
          type: integer
        serialNumber:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        expectedStatus:
          type: string
        actualStatus:
          type: string
        countedQuantity:
          type: number
          format: decimal
        difference:
          type: string
        note:
          type: string

    # =========================== CUSTOMER ===========================
    CustomerRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        note:
          type: string

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== LOCATION ===========================
    LocationRequest:
      type: object
      properties:
        zoneCode:
          type: string
        shelfCode:
          type: string
        binCode:
          type: string
        description:
          type: string

    LocationResponse:
      type: object
      properties:
        id:
          type: integer
        zoneCode:
          type: string
        shelfCode:
          type: string
        binCode:
          type: string
        fullCode:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        maxCapacity:
          type: number
          format: decimal
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =========================== LOCATION MAP ===========================
    LocationMapResponse:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneData"

    ZoneData:
      type: object
      properties:
        zoneCode:
          type: string
        shelves:
          type: array
          items:
            $ref: "#/components/schemas/ShelfData"

    ShelfData:
      type: object
      properties:
        shelfCode:
          type: string
        bins:
          type: array
          items:
            $ref: "#/components/schemas/BinData"

    BinData:
      type: object
      properties:
        id:
          type: integer
        binCode:
          type: string
        fullCode:
          type: string
        productCount:
          type: integer
          format: int64

    # =========================== INVENTORY ===========================
    InventoryItemResponse:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: integer
        minStock:
          type: integer
        location:
          type: string
        updatedAt:
          type: string
          format: date-time

    # =========================== DASHBOARD ===========================
    DashboardResponse:
      type: object
      properties:
        totalProducts:
          type: integer
          format: int64
        totalItems:
          type: integer
          format: int64
        lowStockCount:
          type: integer
          format: int64
        activeProducts:
          type: integer
          format: int64

    # =========================== CATEGORY ZONE ===========================
    CategoryZoneResponse:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        zoneCode:
          type: string

    # =========================== STOCK ADJUSTMENT ===========================
    StockAdjustmentResponse:
      type: object
      properties:
        id:
          type: integer
        adjustCode:
          type: string
        type:
          type: string
        productUnitId:
          type: integer
          nullable: true
        serialNumber:
          type: string
          nullable: true
        productId:
          type: integer
          nullable: true
        productName:
          type: string
          nullable: true
        productSku:
          type: string
          nullable: true
        quantity:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        status:
          type: string
        createdBy:
          type: integer
        createdByName:
          type: string
          nullable: true
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        approvalNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStockAdjustmentRequest:
      type: object
      properties:
        type:
          type: string
        productUnitId:
          type: integer
          nullable: true
        productId:
          type: integer
          nullable: true
        quantity:
          type: integer
          nullable: true
        reason:
          type: string
        imageUrl:
          type: string
          nullable: true

    ApproveAdjustmentRequest:
      type: object
      properties:
        approvalNote:
          type: string
          nullable: true

    # =========================== PRICE ADJUSTMENT ===========================
    PriceAdjustmentResponse:
      type: object
      properties:
        id:
          type: integer
        adjustCode:
          type: string
        importReceiptItemId:
          type: integer
        productName:
          type: string
          nullable: true
        productSku:
          type: string
          nullable: true
        oldPrice:
          type: number
          format: decimal
        newPrice:
          type: number
          format: decimal
        reason:
          type: string
          nullable: true
        status:
          type: string
        createdBy:
          type: integer
        createdByName:
          type: string
          nullable: true
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        approvalNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePriceAdjustmentRequest:
      type: object
      required: [importReceiptItemId, newPrice, reason]
      properties:
        importReceiptItemId:
          type: integer
        newPrice:
          type: number
          format: decimal
        reason:
          type: string

    # =========================== PURCHASE ORDER ===========================
    PurchaseOrderResponse:
      type: object
      properties:
        id:
          type: integer
        poCode:
          type: string
        supplierId:
          type: integer
        supplierName:
          type: string
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
        expectedDate:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        createdBy:
          type: integer
        createdByName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/POItemResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    POItemResponse:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal
        receivedQuantity:
          type: number
          format: decimal

    CreatePurchaseOrderRequest:
      type: object
      required: [supplierId, items]
      properties:
        supplierId:
          type: integer
        expectedDate:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/POItemRequest"

    POItemRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: number
          format: decimal
        unitPrice:
          type: number
          format: decimal

    # =========================== RETURN RECEIPT ===========================
    ReturnReceiptResponse:
      type: object
      properties:
        id:
          type: integer
        receiptCode:
          type: string
        customerId:
          type: integer
          nullable: true
        customerName:
          type: string
          nullable: true
        originalExportReceiptId:
          type: integer
          nullable: true
        reason:
          type: string
        status:
          type: string
        note:
          type: string
          nullable: true
        createdBy:
          type: integer
        createdByName:
          type: string
        approvedBy:
          type: integer
          nullable: true
        approvedByName:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnReceiptItemResponse"

    ReturnReceiptItemResponse:
      type: object
      properties:
        id:
          type: integer
        productUnitId:
          type: integer
        productId:
          type: integer
        quantity:
          type: number
          format: decimal
        condition:
          type: string
        resultingAction:
          type: string

    ReturnReceiptRequest:
      type: object
      required: [customerId, originalExportReceiptId, reason, items]
      properties:
        customerId:
