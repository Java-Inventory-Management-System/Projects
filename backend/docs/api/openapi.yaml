          type: integer
          nullable: true
        customerName:
          type: string
          nullable: true
        saleReceiptCode:
          type: string
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/WarrantyRequestResponse"

    CreateWarrantyRequest:
      type: object
      required: [serialNumber, customerId, issueDescription]
      properties:
        serialNumber:
          type: string
        customerId:
          type: integer
        issueDescription:
          type: string
        note:
          type: string
          nullable: true
        allowExpired:
          type: boolean
          nullable: true

