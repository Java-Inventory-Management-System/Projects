                  - properties:
                      data:
                        type: string

  /api/v1/auth/change-password:
    put:
      tags: [Auth]
      summary: Change current user's password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
