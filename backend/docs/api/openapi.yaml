      operationId: toggleSupplierActive
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseObject"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SupplierResponse"

  # =========================== PRODUCT IMAGE ===========================
  /api/v1/product-image:
    post:
      tags: [Product Image]
      summary: Add image to product
      operationId: createProductImage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseObject"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ProductImageResponse"

  /api/v1/product-image/product/{productId}:
    get:
      tags: [Product Image]
      summary: List images for a product
      operationId: getProductImages
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseObject"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductImageResponse"
    delete:
      tags: [Product Image]
      summary: Delete all images for a product
      operationId: deleteProductImagesByProductId
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseObject"

  /api/v1/product-image/{id}:
    delete:
      tags: [Product Image]
      summary: Delete a single product image
      operationId: deleteProductImage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseObject"

  # =========================== AUDIT LOG ===========================
  /api/v1/audit-logs:
    get:
      tags: [Audit Log]
      summary: Search audit logs (paginated)
      operationId: searchAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entity
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/sizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseObject"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ResponsePage"

