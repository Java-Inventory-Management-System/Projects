      type: object
      properties:
        productUnitId:
          type: integer
        serialNumber:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productSku:
          type: string
        productUnitStatus:
          type: string
        purchaseDate:
          type: string
          format: date-time
