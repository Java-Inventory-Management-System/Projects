services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/src:/app/src
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_ENABLED: "false"
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-false}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_API_URL: ${VITE_BASE_API_URL:-/api/v1}
        VITE_ENABLED_AUTH: ${VITE_ENABLED_AUTH:-false}
    ports:
      - '5173:80'
