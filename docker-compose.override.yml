services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/src:/app/src
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_ENABLED: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_API_URL: ${VITE_BASE_API_URL:-/api/v1}
    ports:
      - '5173:80'
